<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0e10" />
    <!-- Per-page title, description, canonical and Open Graph tags are injected
         by the Seo component (react-helmet-async) at build time. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Ace Group of Companies",
        "alternateName": ["Ace Group", "Ace the Academia"],
        "url": "https://acesoftwares.tech/",
        "logo": "https://acesoftwares.tech/favicon.png",
        "image": "https://acesoftwares.tech/og-image.png",
        "foundingDate": "2024",
        "email": "aceacademia2022@gmail.com",
        "description": "Ace Group of Companies and Ace the Academia: education, software, AI automation, transportation and EdTech in South Africa.",
        "address": { "@type": "PostalAddress", "addressCountry": "ZA" },
        "areaServed": { "@type": "Country", "name": "South Africa" },
        "sameAs": ["https://www.linkedin.com/company/ace-the-academia/"],
        "knowsAbout": [
          "Education",
          "Software Development",
          "AI and Automation Engineering",
          "eHailing and Transportation",
          "Educational Technology"
        ]
      }
    </script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ace-theme");
          var theme = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
